[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "quantum-optimizer-tool"
version = "0.1.0"
description = "AI agent middleware that turns natural-language optimization problems into QUBO and runs them on AWS Braket."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "tsukasakaneko" },
]
keywords = [
    "quantum",
    "optimization",
    "qubo",
    "braket",
    "strands",
    "bedrock",
    "llm",
    "agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "amazon-braket-sdk",
    "numpy",
    "networkx",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab",
    "matplotlib",
]
agents = [
    "strands-agents",
    "boto3",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
    "build",
]

[project.urls]
Homepage = "https://github.com/tsukasakaneko/quantum-optimizer-tool"
Repository = "https://github.com/tsukasakaneko/quantum-optimizer-tool"
Issues = "https://github.com/tsukasakaneko/quantum-optimizer-tool/issues"
Changelog = "https://github.com/tsukasakaneko/quantum-optimizer-tool/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_optimizer"]

[tool.hatch.build.targets.sdist]
include = [
    "src/quantum_optimizer",
    "tests",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
